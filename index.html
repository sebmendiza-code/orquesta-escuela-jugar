    <script>
      // Control de arranque: si main.js no llegó a iniciar (módulo faltante o error de carga),
      // se muestra un aviso con opción de reintentar en lugar de una pantalla negra.
      setTimeout(function () {
        if (window.__oefvBooted) return;
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#11132b;color:#fff;font:700 15px Nunito,sans-serif;text-align:center;';
        box.innerHTML = '<div style="font-size:20px;color:#FFD52B">🎻 No se pudo iniciar el juego</div><div style="font-size:13px;color:#cfd6ff;max-width:480px">Revisá tu conexión e intentá de nuevo. Tu progreso guardado en este dispositivo no se modificó.</div>';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '↻ Reintentar';
        btn.style.cssText = 'min-width:200px;min-height:48px;border:0;border-radius:14px;background:#22a879;color:#fff;font:800 15px Nunito,sans-serif;';
        btn.onclick = function () { location.reload(); };
        box.appendChild(btn);
        document.body.appendChild(box);
        console.error('[arranque] main.js no se inició en 12 segundos.');
      }, 12000);
    </script>

<script>
    (() => {
        const splashRoot = document.getElementById('rosebud-exported-splash');
        if (!splashRoot) return;

        let isReady = false;
        let isMinimumVisibleTimeElapsed = false;
        let isHidden = false;

        const maybeHideSplash = () => {
            if (isHidden || !isReady || !isMinimumVisibleTimeElapsed) return;

            isHidden = true;
            splashRoot.classList.add('is-hiding');
            window.setTimeout(() => splashRoot.remove(), 500);
        };

        const markReady = () => {
            isReady = true;
            maybeHideSplash();
        };

        window.setTimeout(() => {
            isMinimumVisibleTimeElapsed = true;
            maybeHideSplash();
        }, 1000);

        if (document.readyState === 'complete') {
            markReady();
        } else {
            window.addEventListener('load', markReady, { once: true });
        }

        
    })();
</script></body>
